[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wgu"
version = "0.1.0"
description = "wargame_utils: rules knowledge base, translation, player aids and digitization export for board wargames"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "jsonschema>=4.18", "pymupdf>=1.24", "mcp>=1.12,<2", "defusedxml>=0.7.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]
mcp = ["mcp>=1.12,<2"]

[project.scripts]
wgu = "wgu.cli:main"

[tool.setuptools.packages.find]
include = ["wgu*"]

[tool.setuptools.package-data]
wgu = ["schemas/*.json"]
