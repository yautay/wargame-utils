  - gboh.individual-order
  status: proposal
  decided_by: analyst
  rationale: Forma spójna w PL3 (LC 58×). Para z „rozkazem indywidualnym” jest przejrzysta.
  evidence:
  - source: GMT-SPQR-PL3
    where: s. 8; LC 58×
    form: Rozkaz Liniowy (LC)
    supports: usage-in-games
- id: gboh.line
