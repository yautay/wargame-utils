- id: gboh.rout
  source_term: Rout
  variants:
  - routs
  - Routed
  - routed
  - routing
  - Routing
  - rout
  sense: Stan i ruch jednostki, która utraciła spójność (trafienia ≥ TQ). Ucieka w Segmencie Ucieczki i jest uwzględniana w punktach ucieczki.
  disambiguation: Nie mylić z uporządkowanym wycofaniem (Orderly Withdrawal) ani z wycofaniem armii (Army Withdrawal).
  rules:
  - SPQR-10.2
  - SPQR-10.14
  pl: ucieczka
  pl_forms:
  - ucieczka
  - ucieczki
  - ucieczce
  - ucieczkę
  - ucieczką
  - ucieka
  - uciekają
  - uciekać
  - uciekająca
  - uciekającej
  - uciekającą
  - uciekające
  - uciekających
  related:
  - gboh.orderly-withdrawal
  rejected:
  - pl: rozbicie
    reason: „rozbić” = pokonać przeciwnika; inny sens
  status: proposal
  decided_by: analyst
  rationale: Forma PL3 dla rout jest dobra. Błąd PL3 polega na rozszerzeniu „ucieczki” na OW i Withdrawal Level (s. 15, 31), więc tamte pojęcia dostają inne nazwy.
  evidence:
  - source: GMT-SPQR-PL3
    where: s. 23, 29
    form: ucieczka
    supports: usage-in-games
  - source: GMT-SPQR-PL3
    where: s. 15, 31
    form: „rodzaj ucieczki” o OW; „Próg Ucieczki”
    supports: against
- id: gboh.rally
  source_term: Rally
  variants:
  - Rallied
  - rallied
  - rally
  - rallies
  sense: Próba przywrócenia uciekającej jednostki do walki przez dowódcę (rzut na Tabeli Rally). Po udanej próbie jednostka staje się osłabiona (Depleted).
  disambiguation: Inne pojęcie niż Recovery (SPQR 10.16, usuwanie trafień rozkazem).
  rules:
  - SPQR-10.28
  - SPQR-10.31
  pl: zebranie
  pl_forms:
  - zebranie
  - zebrania
  - zebraniu
  - zebraniem
  - zebrać
  - zebrana
  - zebranej
  - zebraną
  - zebrane
  - zebranych
  - zbiera
  related:
  - gboh.rout
  - gboh.depleted
  status: disputed
  decided_by: analyst
  rationale: PL3 używa „reorganizacja”, ale w GCACW-PL to nazwa Recovery Phase. Ponadto SPQR ma osobne Recovery (10.16), więc „reorganizacja” groziłaby kolizją. „Zebrać uciekających” to tradycyjne polskie wyrażenie wojskowe (do potwierdzenia źródłem). DECYZJA WŁAŚCICIELA.
  evidence:
  - source: GMT-SPQR-PL3
    where: s. 30
    form: reorganizacja / zreorganizować
    supports: usage-in-games
