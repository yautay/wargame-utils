  sense: Rozkaz wydany przez dowódcę całej linii (grupie jednostek określonego typu ustawionych w linii), zamiast rozkazów indywidualnych.
  disambiguation: Nazwa rozkazu. Samo „line” (bez Command) to grupa jednostek objętych rozkazem, zob. gboh.line.
