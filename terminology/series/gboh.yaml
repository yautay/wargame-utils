  source_term: Orderly Withdrawal
  variants:
  - OW
  sense: Reakcja jednostki (zwykle lekkiej) wycofującej się przed nadchodzącym przeciwnikiem, bez utraty spójności.
  disambiguation: Nie ucieczka (Rout) i nie wycofanie armii.
  rules:
