- id: gboh.skirmisher
  source_term: Skirmisher
  variants:
  - Skirmishers
  - skirmisher
  - skirmishers
  - SK
  sense: Typ jednostki lekkiej piechoty (SK) walczącej w rozproszeniu bronią miotaną.
  pl: harcownik
  pl_forms:
  - harcownik
  - harcownika
  - harcownikowi
  - harcownikiem
  - harcowniku
  - harcownicy
  - harcowników
  - harcownikom
  - harcownikami
  - harcownikach
  status: disputed
  decided_by: analyst
  rationale: 'PL3 używa „harcownicy”, ale WSJP definiuje harcownika jako żołnierza biorącego udział w pojedynku przed bitwą (harce), nie jako lekkiego piechura walczącego w szyku rozproszonym. Kandydaci do decyzji: harcownik (tradycja graczy i PL3; sens szerszy w historiografii), lekkozbrojny (opisowe), pozostawienie SK z opisem. DECYZJA WŁAŚCICIELA.'
  evidence:
  - source: GMT-SPQR-PL3
    where: passim
    form: harcownicy
    supports: usage-in-games
  - source: WSJP
    where: https://wsjp.pl/haslo/podglad/71290/harcownik/5183889/na-wojnie
    supports: against
    note: 'definicja: uczestnik pojedynku przed bitwą; brak kwalifikatora (archaizm rzeczowy)'
    checked: '2026-10-04'
