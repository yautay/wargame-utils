- id: gboh.leader
  source_term: Leader
  variants:
  - Leaders
  - leader
  - leaders
  sense: Żeton dowódcy (OC, SC, trybun, prefekt). Wydaje rozkazy, ma parametry Initiative, Command Range i inne.
  rules:
  - SPQR-4.1
  pl: dowódca
  pl_forms:
  - dowódca
  - dowódcy
  - dowódcę
  - dowódcą
  - dowódco
  - dowódców
  - dowódcom
  - dowódcami
  - dowódcach
  rejected:
  - pl: wódz
    forms:
    - wodza
    - wodzowi
    - wodzem
    - wodzowie
    reason: PL3 (s. 4) używa zamiennie „dowódca/wódz”; w przepisach jedno pojęcie = jeden termin. „Wódz” zostaje tylko w komentarzach historycznych i nazwie Słonia Wodza, jeśli właściciel tak zdecyduje
  status: proposal
  decided_by: analyst
  evidence:
  - source: GMT-SPQR-PL3
    where: s. 4 (słowniczek)
    form: dowódca / wódz
    supports: usage-in-games
  - source: GCACW-PL
    where: §6
    form: dowódca
    supports: usage-in-games
- id: gboh.line-command
