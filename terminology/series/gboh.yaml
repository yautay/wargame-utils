  source_term: Cohesion Hit
  variants:
  - Cohesion Hits
  - hit
  - hits
  - Hit
  - Hits
  sense: Jednostka utraty spójności, zaznaczana znacznikiem liczbowym. Gdy liczba trafień ≥ TQ, jednostka ucieka (SPQR 10.14).
  disambiguation: „hit” w SPQR zawsze w tym sensie, chyba że mowa o trafieniu dowódcy (Leader Casualty).
  rules:
  - SPQR-10.1
  - SPQR-10.12
  - SPQR-10.14
  pl: trafienie
  pl_forms:
  - trafienie
  - trafienia
  - trafieniu
  - trafieniem
  - trafień
  - trafieniom
  - trafieniami
  - trafieniach
  notation:
    first_use: trafienie (utrata spójności)\ang{Cohesion Hit}
    capitalisation: 'mała litera (PL3 niekonsekwentnie: 33× wielka, 115× mała)'
  status: proposal
  decided_by: analyst
  rationale: Forma dominująca w PL3, krótka, zgodna z napisem na znacznikach („Hits”). Alternatywa do decyzji to „punkt utraty spójności” (dłuższa, opisowa).
  evidence:
  - source: GMT-SPQR-PL3
    where: s. 13–14, 29
    form: trafienie / trafienie na spójność
    supports: usage-in-games
- id: gboh.tq-rating
  source_term: Troop Quality Rating
  variants:
  - TQ rating
  - TQ
  - Troop Quality
  - printed TQ
  sense: Wydrukowany parametr jakości jednostki. Jest progiem testów TQ i limitem trafień.
  disambiguation: Parametr (wartość). Test to osobne pojęcie gboh.tq-check.
  rules:
  - SPQR-2.21
  - SPQR-10.11
  pl: wartość TQ
  pl_forms:
  - wartość TQ
  - wartości TQ
  - wartością TQ
  pl_abbrev: TQ
  notation:
    first_use: jakość wojska (TQ)\ang{Troop Quality}
  related:
  - gboh.tq-check
  status: proposal
  decided_by: analyst
  rationale: PL3 rozwija TQ jako „Jakość Oddziału”, ale w przepisach używa skrótu. Skrót zostaje, bo widnieje na żetonach. Rozwinięcie przy pierwszym użyciu jest do decyzji.
  evidence:
  - source: GMT-SPQR-PL3
    where: s. 3
    form: Jakość Oddziału (TQ)
    supports: usage-in-games
