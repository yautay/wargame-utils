- id: gboh.movement-allowance
  source_term: Movement Allowance
  variants:
  - MA
  - Movement Allowances
  sense: Wydrukowany na żetonie parametr — liczba punktów ruchu dostępna jednostce na jeden rozkaz (SPQR 6.11).
  disambiguation: Parametr, nie koszt (punkty ruchu) i nie odległość. W GCACW MA jest wynikiem rzutu (pojęcie pokrewne, warstwa gcacw).
  rules:
  - SPQR-6.11
  pl: limit punktów ruchu
  pl_forms:
  - limit punktów ruchu
  - limitu punktów ruchu
  - limitem punktów ruchu
  - limicie punktów ruchu
  - limity punktów ruchu
  pl_abbrev: MA
  related:
  - gboh.movement-point
  rejected:
  - pl: ruchliwość
    reason: PL3 (s. 13) „Ruchliwość (MA)” — słowo ogólne, używane też w sensie potocznym (s. 5–6); nie oddaje, że to limit punktów
  status: proposal
  decided_by: analyst
  rationale: Ujednolicenie z decyzją właściciela w GCACW-PL (limit punktów ruchu) i jednoznaczność. Alternatywa do decyzji to „punkty ruchu”, jak na diagramie żetonu PL3 s. 4.
  evidence:
  - source: GMT-SPQR-PL3
    where: s. 13; diagram s. 4
    form: Ruchliwość (MA); punkty ruchu
    supports: against
  - source: GCACW-PL
    where: §6
    form: limit punktów ruchu (MA)
    supports: usage-in-games
