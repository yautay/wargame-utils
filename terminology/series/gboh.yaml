  source_term: Depleted
  variants:
  - Depletion
  - Depletions
  - depleted
  sense: Trwały stan jednostki po udanym zebraniu (lub od początku scenariusza), oznaczany odwróceniem żetonu. Pogarsza walkę wręcz, ostrzał i zebranie.
  rules:
  - SPQR-10.31
  - SPQR-10.32
  - SPQR-10.33
  pl: osłabiona
  pl_forms:
  - osłabiona
  - osłabionej
  - osłabioną
  - osłabione
  - osłabionych
  - osłabionym
  - osłabionymi
  - osłabienie
  - osłabienia
  - osłabieniu
  - osłabieniem
  rejected:
  - pl: ze stratami
    forms:
    - poniosła straty
    - Straty
    reason: PL3 (s. 3, 4, 30) — kolizja ze „stratami wśród dowódców” (Leader Casualty, s. 10)
  status: disputed
  decided_by: analyst
  rationale: 'Kandydaci: „osłabiona / osłabienie” (naturalne, ale „osłabić” bywa używane ogólnie) albo „uszczuplona / uszczuplenie” (dokładniej oddaje ubytek ludzi; Design Note 10.3: „actual loss of men”). DECYZJA WŁAŚCICIELA.'
  evidence:
  - source: GMT-SPQR-PL3
    where: s. 3, 4, 30; s. 10
    form: Straty / jednostka ze stratami; straty wśród dowódców
    supports: against
