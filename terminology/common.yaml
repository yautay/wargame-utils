    where: §6
    form: krawędź heksu
    supports: usage-in-games
  - source: decyzja właściciela
    where: rozmowa 2026-10-04
    supports: usage-in-games
    checked: '2026-10-04'
    form: krawędź heksu
  rationale: Zatwierdzone dla wszystkich gier (decyzja właściciela 2026-10-04).
- id: common.drm
  source_term: die roll modifier
  variants:
  - DRM
  - DRMs
  - die-roll modifier
  sense: Wartość dodawana do wyniku rzutu kością albo od niego odejmowana.
  disambiguation: Nie mylić z przesunięciem kolumny tabeli (column shift / adjustment), które jest osobnym pojęciem.
  pl: modyfikator rzutu
  pl_forms:
