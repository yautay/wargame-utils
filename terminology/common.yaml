layer:
  id: common
  level: common
  title: Pojęcia wspólne dla gier wojennych (heksowe gry planszowe)
  sources:
  - GCACW-PL
  - AAP6-2005PL
  - GMT-SPQR-PL3
concepts:
- id: common.zoc
  source_term: Zone of Control
  variants:
  - ZOC
  - ZOCs
  - zone of control
  - Zones of Control
  sense: Heksy przyległe do jednostki (zwykle frontowe), w których jednostki przeciwnika podlegają ograniczeniom ruchu lub obowiązkom walki. Konkretne skutki określa każda gra.
  disambiguation: Mechanika gry. Nie mylić ze współczesną „strefą kontroli” przestrzeni powietrznej.
  pl: strefa kontroli
  pl_forms:
  - strefa kontroli
  - strefy kontroli
  - strefie kontroli
  - strefę kontroli
  - strefą kontroli
  - stref kontroli
  - strefom kontroli
  - strefach kontroli
  - strefami kontroli
  pl_abbrev: ZOC
  notation:
    first_use: strefa kontroli\ang{Zone of Control, ZOC}
    typography: skrót ZOC zostaje, jeśli występuje na komponentach lub w tabelach
  status: approved
  decided_by: user
  rationale: Odpowiednik przyjęty przez właściciela w GCACW-PL. Brak lepszego kandydata, ugruntowany w polskiej społeczności graczy (do potwierdzenia). Zatwierdzone dla wszystkich gier (decyzja właściciela 2026-10-04).
  evidence:
  - source: GCACW-PL
    where: docs/przewodnik_stylu.md §6
    form: strefa kontroli (ZOC)
    supports: usage-in-games
    checked: '2026-10-04'
  - source: AAP6-2005PL
    where: s. 102 (control zone)
    form: strefa kontroli
    supports: against
    note: w AAP-6 to strefa kontrolowanej przestrzeni powietrznej; homonim, nie źródło znaczenia
    checked: '2026-10-04'
  - source: decyzja właściciela
    where: rozmowa 2026-10-04
    supports: usage-in-games
    checked: '2026-10-04'
    form: strefa kontroli
- id: common.hex
  source_term: hex
  variants:
  - hexes
  - hexagon
  sense: Pole planszy w kształcie sześciokąta. Podstawowa jednostka położenia i odległości.
  pl: heks
  pl_forms:
  - heks
  - heksu
  - heksowi
  - heksem
  - heksie
  - heksy
  - heksów
  - heksom
  - heksami
  - heksach
  status: approved
  decided_by: user
  rationale: Utrwalone w polskich instrukcjach gier wojennych. „Sześciokąt” jest poprawny, ale nieużywany w tej funkcji. Zatwierdzone dla wszystkich gier (decyzja właściciela 2026-10-04).
  evidence:
  - source: GCACW-PL
    where: §6
    form: heks
    supports: usage-in-games
  - source: decyzja właściciela
    where: rozmowa 2026-10-04
    supports: usage-in-games
    checked: '2026-10-04'
    form: heks
- id: common.hexside
  source_term: hexside
  variants:
  - hexsides
  - hex side
  sense: Krawędź między dwoma sąsiednimi heksami (rzeka, strumień, grzbiet, mur itp. leżą na krawędzi).
  pl: krawędź heksu
  pl_forms:
  - krawędź heksu
  - krawędzi heksu
  - krawędzią heksu
  - krawędzie heksów
  - krawędziach heksów
  - krawędzi heksów
  related:
