    checked: '2026-10-04'
    form: modyfikator rzutu
  rationale: Zatwierdzone dla wszystkich gier (decyzja właściciela 2026-10-04).
- id: common.stack
  source_term: stack
  variants:
  - stacks
  - stacked
  - stacking
  sense: Kilka żetonów w jednym heksie. Stacking (układanie w stos) to zasady określające, ile i jakich jednostek może zajmować heks.
